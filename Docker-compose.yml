services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"      # снаружи Docker видно только nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf   # ⚠️ без этой строки твой proxy_pass не применится


  redis:
    image: redis:8
    volumes:
      - redis_data:/data   


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # данные переживают перезапуск контейнера (этот путь обязательный !)
  
  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

volumes:
  redis_data:
  postgres_data:
  chroma-data: